<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrangeCloud Player SDK - Web Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }

    .app { max-width: 960px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; margin-bottom: 20px; text-align: center; color: #fff; }

    /* 播放器容器 */
    .video-container {
      width: 100%; aspect-ratio: 16 / 9; background: #000;
      border-radius: 12px; overflow: hidden; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .video-container video { width: 100%; height: 100%; }
    .placeholder { color: #555; font-size: 14px; }

    /* 面板 */
    .panel { background: #16213e; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .panel-title { font-size: 13px; font-weight: 600; color: #888; margin-bottom: 12px; }

    /* 输入 */
    .url-row { display: flex; gap: 8px; }
    .url-row input {
      flex: 1; height: 36px; border: 1px solid #2a3a5e; border-radius: 6px;
      padding: 0 12px; font-size: 13px; background: #0f1a30; color: #eee; outline: none;
      transition: border-color 0.2s;
    }
    .url-row input:focus { border-color: #e94560; }

    /* 按钮 */
    .btn {
      height: 32px; padding: 0 16px; border: none; border-radius: 6px;
      font-size: 13px; cursor: pointer; transition: all 0.2s;
      background: #0f3460; color: #eee;
    }
    .btn:hover { background: #1a5276; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-primary:hover { background: #ff6b6b; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    /* 进度条 */
    .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .progress-bar {
      flex: 1; height: 6px; background: #2a3a5e; border-radius: 3px;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .progress-fill { height: 100%; background: #e94560; border-radius: 3px; width: 0; transition: width 0.1s; }
    .time-label { font-size: 12px; color: #888; min-width: 90px; text-align: center; }

    /* 音量 */
    .volume-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .volume-slider { width: 100px; accent-color: #e94560; }

    /* 倍速 */
    .rate-select {
      height: 28px; background: #0f1a30; border: 1px solid #2a3a5e;
      border-radius: 4px; color: #eee; font-size: 12px; padding: 0 8px; outline: none;
    }

    /* 事件日志 */
    .log-area {
      height: 160px; overflow-y: auto; background: #0a0f1e; border-radius: 8px;
      padding: 12px; font-family: 'SF Mono', Menlo, monospace; font-size: 12px;
      line-height: 1.6; color: #7ec8e3;
    }
    .log-area::-webkit-scrollbar { width: 4px; }
    .log-area::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 2px; }
    .log-item { margin-bottom: 2px; }
    .log-item .time { color: #555; }
    .log-item.error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="app">
    <h1>🎬 OrangeCloud Player SDK - Web Demo</h1>

    <!-- URL 输入 -->
    <div class="panel">
      <div class="panel-title">媒体地址</div>
      <div class="url-row">
        <input type="text" id="urlInput" placeholder="输入播放地址 (HLS/DASH/MP4)" value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" />
        <button class="btn btn-primary" id="btnLoad">加载播放</button>
      </div>
    </div>

    <!-- 播放器 -->
    <div class="video-container" id="playerContainer">
      <span class="placeholder">等待加载媒体...</span>
    </div>

    <!-- 进度 & 控制 -->
    <div class="panel">
      <div class="progress-row">
        <span class="time-label" id="timeLabel">00:00 / 00:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn" id="btnPlay">▶ 播放</button>
        <button class="btn" id="btnPause">⏸ 暂停</button>
        <button class="btn" id="btnStop">⏹ 停止</button>
        <button class="btn" id="btnLoop">🔁 循环: 关</button>
      </div>
      <div class="volume-row">
        <button class="btn" id="btnMute" style="padding:0 10px;">🔊</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" />
        <select class="rate-select" id="rateSelect">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
      </div>
    </div>

    <!-- 事件日志 -->
    <div class="panel">
      <div class="panel-title">事件日志</div>
      <div class="log-area" id="logArea"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
